packages:
  - apps/*
  - packages/*

# Fail the install when Node.js or pnpm does not match "engines".
engineStrict: true

# One version of each shared tool for the whole repository. Packages refer to
# these with "catalog:". Dependabot proposes updates.
catalog:
  "@eslint/js": 10.0.1
  "@formatjs/icu-messageformat-parser": 3.5.23
  "@hono/node-server": 2.1.8
  "@hono/zod-openapi": 1.6.3
  "@playwright/test": 1.65.0
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 10.14.0
  globals: 17.14.0
  hono: 4.13.18
  intl-messageformat: 12.1.5
  libphonenumber-js: 1.13.16
  pg: 8.23.1
  pino: 10.4.0
  prettier: 3.10.1
  turbo: 2.11.11
  typescript: 6.0.3
  typescript-eslint: 8.72.2
  vitest: 5.1.0
  zod: 4.6.7

# Dependencies allowed to run install scripts; anything not listed is blocked.
# esbuild (used by drizzle-kit) checks its platform binary. @parcel/watcher
# (used by Jest) ships prebuilt binaries, so its build script is not needed.
allowBuilds:
  "@parcel/watcher": false
  esbuild: true
