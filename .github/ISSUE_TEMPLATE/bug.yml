name: Bug
description: Something does not work as described
title: "fix: "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Do not include real personal data (names, phone numbers, messages).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - Android
        - Web
        - Admin console
        - API
  - type: input
    id: version
    attributes:
      label: App version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal data before pasting.
