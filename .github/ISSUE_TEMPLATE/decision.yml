name: Decision needed
description: A question that needs a decision, and possibly an ADR
title: "decision: "
labels: ["type: decision"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What needs to be decided?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why now, what constraints apply, what happens if we wait?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: The options you see, with pros and cons.
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
