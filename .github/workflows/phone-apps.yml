name: Phone apps

# The Android and iPhone apps as real release builds, on an emulator and the
# simulator, against the test API on the same machine (spec 32, 3.7; ADR
# 0051). Maestro walks the journeys in apps/mobile/maestro and keeps a
# screenshot of each screen. Free while the repository is public: GitHub
# does not count minutes on public repositories, macOS included.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/phone-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_VERSION: "2.13.0"
  # The test API (apps/api/src/e2e-server.ts) writes texts and emails here.
  E2E_SMS_OUTBOX: ${{ github.workspace }}/e2e-sms.jsonl
  E2E_EMAIL_OUTBOX: ${{ github.workspace }}/e2e-email.jsonl

jobs:
  android:
    name: Android app on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: shareride
          POSTGRES_PASSWORD: shareride-ci-only
          POSTGRES_DB: shareride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shareride -d shareride_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://shareride:shareride-ci-only@localhost:5432/shareride_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: "17"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Start the test API
        env:
          PORT: "3001"
        run: |
          nohup pnpm --filter @shareride/api e2e:serve > "$RUNNER_TEMP/api.log" 2>&1 &
      # Plain http to the test API is allowed in this build only (R32.1).
      - name: The native project
        working-directory: apps/mobile
        env:
          E2E_CLEARTEXT: "1"
        run: npx expo prebuild --platform android --no-install
      - name: Release build against the test API
        working-directory: apps/mobile/android
        env:
          # The emulator's name for this machine.
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3001
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Install Maestro
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The journeys on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/mobile
          # Each line runs in its own shell.
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            bash maestro/run.sh emulator-5554 is.puffinride.app android
      - name: Keep the screenshots and Maestro's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phone-android
          path: |
            apps/mobile/screenshots/
            apps/mobile/maestro-results/
            ${{ runner.temp }}/api.log
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iPhone app on the simulator
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TEST_DATABASE_URL: postgres://shareride@localhost:5432/shareride_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # macOS runners have no containers: PostgreSQL 18 and PostGIS from Homebrew.
      - name: PostgreSQL 18 with PostGIS
        run: |
          brew install --quiet postgresql@18 postgis
          pg="$(brew --prefix postgresql@18)/bin"
          "$pg/initdb" --pgdata "$RUNNER_TEMP/pg" --username shareride --auth trust
          "$pg/pg_ctl" --pgdata "$RUNNER_TEMP/pg" --log "$RUNNER_TEMP/pg.log" --wait start
          "$pg/createdb" --username shareride shareride_test
      - name: Start the test API
        env:
          PORT: "3001"
        run: |
          nohup pnpm --filter @shareride/api e2e:serve > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: The native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios
      - name: Release build for the simulator against the test API
        working-directory: apps/mobile/ios
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3001
          NODE_ENV: production
        run: |
          set -o pipefail
          xcodebuild -workspace PuffinRide.xcworkspace -scheme PuffinRide \
            -configuration Release -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "^(\*\*|error|warning: .*deprecated)" || true
          test -d build/Build/Products/Release-iphonesimulator/PuffinRide.app
      - name: Install Maestro
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: The journeys on the simulator
        working-directory: apps/mobile
        run: |
          udid="$(xcrun simctl list devices available --json | node -e '
            const { devices } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const runtimes = Object.keys(devices).filter((r) => r.includes("iOS")).sort();
            const phones = devices[runtimes.at(-1)].filter((d) => /^iPhone \d+$/.test(d.name));
            process.stdout.write((phones.at(-1) ?? devices[runtimes.at(-1)][0]).udid);
          ')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" ios/build/Build/Products/Release-iphonesimulator/PuffinRide.app
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            ios/build/Build/Products/Release-iphonesimulator/PuffinRide.app/Info.plist)"
          bash maestro/run.sh "$udid" "$bundle_id" ios
      - name: Keep the screenshots and Maestro's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phone-ios
          path: |
            apps/mobile/screenshots/
            apps/mobile/maestro-results/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
