name: Road file

# Builds our road file (ADR 0030) from the latest OpenStreetMap extract of
# Iceland. Run it by hand when the map data should be updated (at least every
# three months); a pull request that changes the builder runs it too. The file
# comes out as the "road-file" artifact, to be committed as
# packages/db/src/roads/iceland-roads.json.gz (docs/engineering/road-file.md),
# and the job checks known distances on it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/road-file.yml
      - packages/db/src/roads/build.ts
      - packages/db/src/roads/build-cli.ts
      - packages/db/src/roads/iceland-roads.test.ts
      - packages/domain/src/roads/road-file.ts

permissions:
  contents: read

jobs:
  build:
    name: Build the road file
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Download the Iceland extract and check it
        run: |
          base=https://download.geofabrik.de/europe/iceland-latest.osm.pbf
          # Geofabrik sometimes refuses a connection: try again on any error.
          fetch() { curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -o "$1" "$2"; }
          fetch iceland.osm.pbf "$base"
          fetch iceland.osm.pbf.md5 "$base.md5"
          echo "$(cut -d ' ' -f 1 iceland.osm.pbf.md5)  iceland.osm.pbf" | md5sum -c -
          osmium fileinfo -g header.option.osmosis_replication_timestamp iceland.osm.pbf | tee map-date.txt
      - name: Keep the roads cars may use
        run: |
          osmium tags-filter iceland.osm.pbf \
            w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service \
            -o roads.osm.pbf
          osmium cat roads.osm.pbf -f opl,add_metadata=false -o roads.opl
      - name: Build the road file
        run: node packages/db/src/roads/build-cli.ts roads.opl "$(cat map-date.txt)" iceland-roads.json.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: road-file
          path: iceland-roads.json.gz
          if-no-files-found: error
          retention-days: 30
      - name: Check known distances on the new file
        run: pnpm --filter @shareride/db exec vitest run src/roads/iceland-roads.test.ts
        env:
          ROAD_FILE: ${{ github.workspace }}/iceland-roads.json.gz
