name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint, type check and unit tests
        run: pnpm check
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high

  api:
    name: API integration tests and image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: shareride
          POSTGRES_PASSWORD: shareride-ci-only
          POSTGRES_DB: shareride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shareride -d shareride_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://shareride:shareride-ci-only@localhost:5432/shareride_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Integration tests (migrations, API against PostgreSQL)
        run: pnpm test:integration
      # The image includes the exported web app; Render builds the same
      # Dockerfile and deploys main only after these checks pass.
      - name: Build the API container image (not pushed)
        run: docker build --file apps/api/Dockerfile --tag shareride-api:${{ github.sha }} .
      - name: Smoke test the image (migrations on an empty database, start-up, web app)
        env:
          DATABASE_URL: postgres://shareride:shareride-ci-only@localhost:5432/shareride_smoke
        run: |
          docker run --rm --network host postgis/postgis:18-3.7 \
            psql "$TEST_DATABASE_URL" --command "CREATE DATABASE shareride_smoke"
          infra/docker/smoke-test.sh shareride-api:${{ github.sha }}

  app:
    name: App bundles (iOS, Android, web) and web tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The web tests sign up against the API with a test database (e2e-server.ts).
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: shareride
          POSTGRES_PASSWORD: shareride-ci-only
          POSTGRES_DB: shareride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shareride -d shareride_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      EXPO_NO_TELEMETRY: "1"
      TEST_DATABASE_URL: postgres://shareride:shareride-ci-only@localhost:5432/shareride_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Bundle for iOS, Android and web
        run: pnpm --filter @shareride/mobile export
      - name: Install Chromium for Playwright
        run: pnpm --filter @shareride/mobile exec playwright install --with-deps chromium
      - name: Web tests against the API (phone and desktop sizes)
        run: pnpm --filter @shareride/mobile e2e:web
      - name: Keep the look screenshots for review (spec 15)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: look-screenshots
          path: apps/mobile/test-results/look/
          if-no-files-found: warn
          retention-days: 14
