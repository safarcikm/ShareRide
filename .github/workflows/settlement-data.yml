name: Settlement data (temporary)

# Temporary: extracts the OpenStreetMap features that the settlement list is
# picked from (place nodes, fuel stations, bus stops, shops, municipality
# boundaries) as an artifact. Removed before the pull request.

on:
  push:
    branches: [claude/project-thread-8sehni]
    paths: [.github/workflows/settlement-data.yml]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Download the Iceland extract and check it
        run: |
          base=https://download.geofabrik.de/europe/iceland-latest.osm.pbf
          fetch() { curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -o "$1" "$2"; }
          fetch iceland.osm.pbf "$base"
          fetch iceland.osm.pbf.md5 "$base.md5"
          echo "$(cut -d ' ' -f 1 iceland.osm.pbf.md5)  iceland.osm.pbf" | md5sum -c -
          osmium fileinfo -g header.option.osmosis_replication_timestamp iceland.osm.pbf | tee map-date.txt
      - name: Keep the features
        run: |
          osmium tags-filter iceland.osm.pbf \
            n/place nwr/amenity=fuel,bus_station,townhall,community_centre,place_of_worship,library,swimming_pool,parking,charging_station \
            n/highway=bus_stop nwr/public_transport=station,stop_position,platform \
            nwr/shop=supermarket,convenience,general,mall,department_store \
            nwr/leisure=sports_centre,swimming_pool nwr/tourism=information,hotel \
            -o features.osm.pbf
          osmium export features.osm.pbf -f geojsonseq --add-unique-id=type_id -o features.geojsonseq
          osmium tags-filter iceland.osm.pbf r/boundary=administrative -o boundaries.osm.pbf
          osmium export boundaries.osm.pbf -f geojsonseq --geometry-types=polygon --add-unique-id=type_id -o boundaries.geojsonseq
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settlement-data
          path: |
            features.geojsonseq
            boundaries.geojsonseq
            map-date.txt
          if-no-files-found: error
          retention-days: 7
