- tapOn:
    text: "Messages"
    childOf:
      id: "tab-bar"
- waitForAnimationToEnd
- takeScreenshot: screenshots/13-messages
- tapOn:
    text: "Profile"
    childOf:
      id: "tab-bar"
- waitForAnimationToEnd
- takeScreenshot: screenshots/14-profile
