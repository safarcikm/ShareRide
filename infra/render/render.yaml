# Staging on Render in Frankfurt (ADR 0018). Create the Blueprint with the
# Blueprint Path infra/render/render.yaml; paths below are relative to the
# repository root. The runbook is docs/operations/staging.md.
#
# No secrets here: Render generates AUTH_SECRET, and asks for the SMS
# provider and the Vonage keys once, when the blueprint is first applied.
#
# Staging's address is https://staging.skinnar.is, on Martin's domain
# skinnar.is for now (2026-11-18). Its DNS is ISNIC DNS Hosting: a CNAME
# from staging.skinnar.is to the service's onrender.com address (runbook).

services:
  # The API, which also serves the web app on the same origin, so the
  # refresh cookie stays first-party. Render's own onrender.com address
  # keeps working too (onrender.com is a public suffix, so it is a site of
  # its own, with its own cookie).
  - type: web
    name: shareride-staging-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    # Render issues and renews its TLS certificate once the DNS record is in.
    domains:
      - staging.skinnar.is
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Deploy a commit on main only after its CI checks pass.
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - .claude/**
    # Render switches traffic to a new deploy only once this answers 200,
    # which needs the database.
    healthCheckPath: /v1/health/ready
    # Runs in the new image before it takes traffic; a failure stops the
    # deploy and keeps the running version.
    preDeployCommand: node packages/db/src/migrate-cli.ts --seed-drafts
    envVars:
      - fromGroup: shareride-staging
      - key: DATABASE_URL
        fromDatabase:
          name: shareride-staging-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # vonage (ADR 0023). Asked for, not set here, so changing it to 46elks
      # in the dashboard (with ELKS_API_USERNAME and ELKS_API_PASSWORD) switches
      # to the fallback and stays that way through blueprint syncs.
      - key: SMS_PROVIDER
        sync: false
      - key: VONAGE_API_KEY
        sync: false
      - key: VONAGE_API_SECRET
        sync: false
      # Two proxies append to X-Forwarded-For: Cloudflare adds the client,
      # then Render's proxy adds the Cloudflare edge. Entries before those
      # come from the client and are ignored.
      - key: TRUST_PROXY
        value: "2"
      # The operator console's origin (ADR 0028): its passkeys are bound to
      # it, so the console signs in at https://staging.skinnar.is/admin only.
      - key: ADMIN_ORIGIN
        value: https://staging.skinnar.is
      # Email (ADR 0027): where its links lead, and the sender on the domain
      # validated in Mailjet. Both wait unused until EMAIL_PROVIDER is set to
      # mailjet, with the Mailjet keys, in the dashboard (runbook, "Turn on
      # email").
      - key: WEB_APP_URL
        value: https://staging.skinnar.is
      - key: EMAIL_FROM
        value: hello@skinnar.is
      # The photo storage settings (ADR 0022) are added in the dashboard when
      # photos are turned on; see the runbook.
      # Google sign-in (ADR 0034): asked for, not set here. GOOGLE_SIGN_IN
      # stays off until it is google and the web client's ID and secret are
      # set; API_ORIGIN is where Google sends the browser back to.
      - key: GOOGLE_SIGN_IN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Sign in with Apple, the same way: APPLE_SIGN_IN stays off until it
      # is apple and the Services ID, team ID, key ID and the key's .p8
      # file are set (the runbook's "Turn on Sign in with Apple").
      - key: APPLE_SIGN_IN
        sync: false
      - key: APPLE_SERVICES_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: API_ORIGIN
        value: https://staging.skinnar.is

  # Deletes records past their retention and erases deleted accounts, every hour (UTC).
  - type: cron
    name: shareride-staging-clean-up
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - .claude/**
    schedule: "17 * * * *"
    dockerCommand: node apps/api/src/clean-up-cli.ts
    envVars:
      - fromGroup: shareride-staging
      - key: DATABASE_URL
        fromDatabase:
          name: shareride-staging-db
          property: connectionString
      # The API's own: erasing a suspended account keeps its number's keyed
      # hash, which sign-up must recognise.
      - key: AUTH_SECRET
        fromService:
          type: web
          name: shareride-staging-api
          envVarKey: AUTH_SECRET

databases:
  - name: shareride-staging-db
    databaseName: shareride
    user: shareride
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 5
    postgresMajorVersion: "18"
    # Private network only: no connections from the internet.
    ipAllowList: []

envVarGroups:
  - name: shareride-staging
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: info
      # Error reports (ADR 0020), to the Sentry organisation shareride-ehf in
      # the EU region (runbook, "Error reports and uptime"). DSNs are not
      # secrets. SENTRY_DSN is the shareride-api project's, for the API and
      # the clean-up job; EXPO_PUBLIC_SENTRY_DSN is shareride-app's, built
      # into the web app (the web service's builds read this group).
      - key: SENTRY_DSN
        value: https://0bb93ebe70504faae21a466419a236db@o4512455618002944.ingest.de.sentry.io/4512455641464912
      - key: EXPO_PUBLIC_SENTRY_DSN
        value: https://278daa0f4943c5fac46be2046a1951b1@o4512455618002944.ingest.de.sentry.io/4512455641595984
